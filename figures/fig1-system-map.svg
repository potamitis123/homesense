<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="812" viewBox="0 0 1240 812" aria-label="The seven sentinel devices and the MQTT broker feed two independent loops: a listening loop that runs sound through a perception stack into SQLite and then into a language-model report, and a live loop carrying intercom, push-to-talk, a voice companion and camera frames that never touches storage."><rect x="0" y="-20" width="1240" height="852" fill="#FFFFFF"/>
        <defs>
          <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#56707A"/>
          </marker>
          <marker id="a1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#A05A00"/>
          </marker>
        </defs>

        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#56707A" letter-spacing="1.16" x="60" y="28">SHARED EDGE</text>
        <line stroke="#C2D1D6" stroke-width="1" x1="60" y1="36" x2="1140" y2="36"/>

        <rect fill="#FFFFFF" stroke="#C2D1D6" stroke-width="1.25" x="60" y="46" width="520" height="86"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#10222A" x="80" y="76">5 × ESP32-S3 · BOX3</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="80" y="97">microphone only — wakes on an RMS threshold</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="80" y="115">Livingroom · Kitchen · Bathroom · Bedroom · WC</text>

        <rect fill="#FFFFFF" stroke="#C2D1D6" stroke-width="1.25" x="620" y="46" width="520" height="86"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#10222A" x="640" y="76">2 × ESP32-P4</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="640" y="97">microphone, camera, loudspeaker, video call</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="640" y="115">Entrance · one spare</text>

        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M300,132 V166" marker-end="url(#a1)"/>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#56707A" letter-spacing="0.42" x="310" y="154">15 s clip + status</text>
        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M180,166 V136" marker-end="url(#a1)"/>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#56707A" letter-spacing="0.42" x="66" y="154">commands</text>
        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M900,132 V166" marker-end="url(#a1)"/>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#56707A" letter-spacing="0.42" x="910" y="154">clip + JPEG</text>
        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M760,166 V136" marker-end="url(#a1)"/>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#56707A" letter-spacing="0.42" x="646" y="154">call setup</text>

        <rect fill="#E2E9EB" stroke="#C2D1D6" stroke-width="1.25" x="60" y="168" width="1080" height="66"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#10222A" x="80" y="197">MQTT broker — mosquitto</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="80" y="218">TLS with client certificates  ·  audio/#  ·  devices/+/status  ·  commands/&lt;id&gt;/stream  ·  live/opus</text>

        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M358,234 V250" marker-end="url(#a1)"/>
        <path fill="none" stroke="#A05A00" stroke-width="1.5" d="M918,234 V250" marker-end="url(#a1a)"/>

        <rect fill="#0D6E79" x="60" y="252" width="595" height="42"/>
        <text fill="#56707A" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing="1.16" x="80" y="278" style="letter-spacing:1.47px; fill:#FFFFFF">1 — THE LISTENING LOOP</text>
        <text fill="#56707A" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" x="635" y="278" text-anchor="end" style="fill:#FFFFFF">stored · reasoned about later</text>

        <rect fill="#A05A00" x="695" y="252" width="445" height="42"/>
        <text fill="#56707A" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing="1.16" x="715" y="278" style="letter-spacing:1.47px; fill:#FFFFFF">2 — THE LIVE LOOP</text>
        <text fill="#56707A" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" x="1120" y="278" text-anchor="end" style="fill:#FFFFFF">nothing stored</text>

        <rect fill="#DCEDEF" stroke="#0D6E79" stroke-width="1.25" x="60" y="318" width="595" height="80"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#10222A" x="80" y="348">Perception stack</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="80" y="369">sound classification → speech gate → words, feeling, meaning</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#56707A" letter-spacing="0.42" x="80" y="388" style="fill:#0D6E79">detail in Figure 2</text>

        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M358,398 V424" marker-end="url(#a1)"/>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#56707A" letter-spacing="0.42" x="368" y="416">one row per clip</text>

        <rect fill="#E2E9EB" stroke="#C2D1D6" stroke-width="1.25" x="60" y="426" width="595" height="80"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#10222A" x="80" y="456">SQLite · ast_table</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="80" y="477">labels + confidences · transcript · emotion · 512-d vector · room · device</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="80" y="495">beside it on disk: mp3, spectrogram, video</text>

        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M202,506 V546" marker-end="url(#a1)"/>
        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M512,506 V546" marker-end="url(#a1)"/>

        <rect fill="#FFFFFF" stroke="#C2D1D6" stroke-width="1.25" x="60" y="548" width="285" height="146"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#10222A" x="80" y="578">Interfaces</text>
        <line stroke="#C2D1D6" stroke-width="1" x1="60" y1="592" x2="345" y2="592"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#10222A" x="80" y="617">Dashboard — 10 tabs</text>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#10222A" x="80" y="640">Mobile API — FastAPI</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="80" y="668">browse · search · listen · watch</text>

        <rect fill="#DCEDEF" stroke="#0D6E79" stroke-width="1.25" x="370" y="548" width="285" height="64"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#10222A" x="390" y="576">Reflection ladder</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="390" y="596">L0 → L4 · detail in Figure 3</text>
        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M512,612 V638" marker-end="url(#a1)"/>

        <rect fill="#DCEDEF" stroke="#0D6E79" stroke-width="1.25" x="370" y="640" width="285" height="64"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#10222A" x="390" y="668">Language model</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="390" y="688">Llama 3.2 local · GPT-4o-mini</text>
        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M512,704 V730" marker-end="url(#a1)"/>

        <rect fill="#DCEDEF" stroke="#0D6E79" stroke-width="1.25" x="370" y="732" width="285" height="64"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#10222A" x="390" y="760">Dynamics report</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="390" y="780">9 fixed sections, in the LLM tab</text>

        <path fill="none" stroke="#A05A00" stroke-width="1.5" d="M715,296 V658"/>
        <path fill="none" stroke="#A05A00" stroke-width="1.5" d="M715,356 H734" marker-end="url(#a1a)"/>
        <path fill="none" stroke="#A05A00" stroke-width="1.5" d="M715,456 H734" marker-end="url(#a1a)"/>
        <path fill="none" stroke="#A05A00" stroke-width="1.5" d="M715,556 H734" marker-end="url(#a1a)"/>
        <path fill="none" stroke="#A05A00" stroke-width="1.5" d="M715,656 H734" marker-end="url(#a1a)"/>

        <rect fill="#F6E8D3" stroke="#A05A00" stroke-width="1.25" x="740" y="318" width="400" height="76"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#10222A" x="760" y="348">Two-way intercom</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="760" y="369">WebRTC · G.711 A-law 8 kHz + JPEG</text>

        <rect fill="#F6E8D3" stroke="#A05A00" stroke-width="1.25" x="740" y="418" width="400" height="76"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#10222A" x="760" y="448">Push-to-talk &amp; broadcast</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="760" y="469">the operator's voice into one room</text>

        <rect fill="#F6E8D3" stroke="#A05A00" stroke-width="1.25" x="740" y="518" width="400" height="76"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#10222A" x="760" y="548">Voice companion</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="760" y="569">LangGraph agent speaks through a BOX3</text>

        <rect fill="#F6E8D3" stroke="#A05A00" stroke-width="1.25" x="740" y="618" width="400" height="76"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#10222A" x="760" y="648">Camera uplink</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="760" y="669">P4 posts JPEG → MJPEG in Visuals</text>

        <path fill="none" stroke="#A05A00" stroke-width="1.5" d="M1140,356 H1192 V90 H1148" marker-end="url(#a1a)"/>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#A05A00" letter-spacing="0.42" x="1178" y="430" text-anchor="middle" transform="rotate(-90 1178 430)">live media — never written to the store</text>
      </svg>
