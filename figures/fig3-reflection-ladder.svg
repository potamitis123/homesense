<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="306" viewBox="0 0 1200 306" aria-label="Five levels turn 2395 raw events into 538 activity episodes, then 1561 person-level episodes, then five daily dynamics records, which are compacted from 8.8 million to 164 thousand characters and sent to a language model that returns a nine-section report."><rect x="0" y="-20" width="1200" height="346" fill="#FFFFFF"/>
        <defs>
          <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#56707A"/>
          </marker>
        </defs>

        <rect fill="#FFFFFF" stroke="#C2D1D6" stroke-width="1.25" x="20" y="46" width="200" height="114"/>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#56707A" letter-spacing="1.16" x="38" y="70">LEVEL 0</text>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#10222A" x="38" y="100">2,395</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="38" y="124">observations</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="38" y="144">time, room, speech parsed</text>
        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M220,103 H236" marker-end="url(#a3)"/>

        <rect fill="#FFFFFF" stroke="#C2D1D6" stroke-width="1.25" x="240" y="46" width="200" height="114"/>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#56707A" letter-spacing="1.16" x="258" y="70">LEVEL 1</text>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#10222A" x="258" y="100">2,395</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="258" y="124">semantic events</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="258" y="144">“Water tap” → water_use</text>
        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M440,103 H456" marker-end="url(#a3)"/>

        <rect fill="#FFFFFF" stroke="#C2D1D6" stroke-width="1.25" x="460" y="46" width="200" height="114"/>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#56707A" letter-spacing="1.16" x="478" y="70">LEVEL 2</text>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#10222A" x="478" y="100">538</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="478" y="124">activity episodes</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="478" y="144">merged by time and room</text>
        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M660,103 H676" marker-end="url(#a3)"/>

        <rect fill="#FFFFFF" stroke="#C2D1D6" stroke-width="1.25" x="680" y="46" width="200" height="114"/>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#56707A" letter-spacing="1.16" x="698" y="70">LEVEL 3</text>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#10222A" x="698" y="100">1,561</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="698" y="124">social episodes</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="698" y="144">who, with whom, turn balance</text>
        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M880,103 H896" marker-end="url(#a3)"/>

        <rect fill="#DCEDEF" stroke="#0D6E79" stroke-width="1.25" x="900" y="46" width="200" height="114"/>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#56707A" letter-spacing="1.16" x="918" y="70" style="fill:#0D6E79">LEVEL 4</text>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#10222A" x="918" y="100">5 days</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="918" y="124">daily dynamics</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="918" y="144">pairs, groups, uncertainties</text>

        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M1000,160 V182 H160 V200" marker-end="url(#a3)"/>

        <rect fill="#FFFFFF" stroke="#C2D1D6" stroke-width="1.25" x="20" y="204" width="280" height="80"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#10222A" x="38" y="232">Compacted for the model</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="38" y="252">8.8 M → 164 k characters</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="38" y="270">full record kept on disk</text>
        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M300,244 H336" marker-end="url(#a3)"/>

        <rect fill="#DCEDEF" stroke="#0D6E79" stroke-width="1.25" x="340" y="204" width="280" height="80"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#10222A" x="358" y="232">Language model</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="358" y="252">Llama 3.2 local, or GPT-4o-mini</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="358" y="270">one 21,000-character instruction</text>
        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M620,244 H656" marker-end="url(#a3)"/>

        <rect fill="#DCEDEF" stroke="#0D6E79" stroke-width="1.25" x="660" y="204" width="280" height="80"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#10222A" x="678" y="232">Dynamics report</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="678" y="252">overview · 16 scored signals</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="678" y="270">episodes · watch areas · limits</text>
        <path fill="none" stroke="#56707A" stroke-width="1.5" d="M940,244 H976" marker-end="url(#a3)"/>

        <rect fill="#FFFFFF" stroke="#C2D1D6" stroke-width="1.25" x="980" y="204" width="200" height="80"/>
        <text font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#10222A" x="998" y="232">LLM tab</text>
        <text font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#56707A" x="998" y="252">rendered and saved</text>
      </svg>
