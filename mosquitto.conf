# =================================================================
# Mosquitto Config for Sentinel Home Server Mode (TLS Port 8883)
# =================================================================

# Listener for secure TLS connections on port 8883
listener 8883 0.0.0.0

# -----------------------------------------------------------------
# Certificate and Key configuration
# Note: Update these paths if Mosquitto is installed elsewhere, 
# or copy your certificates into Mosquitto's cert folder.
# -----------------------------------------------------------------
cafile C:/Users/potam/ast_home/certs/certs/ca.crt
certfile C:/Users/potam/ast_home/certs/certs/hlias.crt
keyfile C:/Users/potam/ast_home/certs/certs/hlias.key

# Require client certificates to connect (Mutual TLS)
require_certificate true

# -----------------------------------------------------------------
# Security & Authentication (Certs-only, No Passwords)
# -----------------------------------------------------------------
# Allow anonymous connections. Because require_certificate is true,
# "anonymous" here means "anyone with a valid certificate signed by ca.crt".
# It will completely ignore any username/password the client sends.
allow_anonymous true

# Optional unencrypted listener on port 1883 for local debugging
listener 1883 127.0.0.1
allow_anonymous true

# -----------------------------------------------------------------
# Persistence: without this the broker forgets every retained message on
# restart, including the retained device status that tells the server which
# sentinels are alive. Losing it makes the dashboard fall back to whatever
# sentinel_status.json last recorded, which may be days old.
# -----------------------------------------------------------------
persistence true
persistence_location C:/Users/potam/ast_home/logs_ast_app/

# -----------------------------------------------------------------
# Logging: keep the broker console readable and also persist a copy so
# sentinel connection failures can be reviewed after the fact.
# -----------------------------------------------------------------
log_dest stdout
log_dest file C:/Users/potam/ast_home/logs_ast_app/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
