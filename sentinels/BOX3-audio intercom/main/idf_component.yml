## IDF Component Manager Manifest File
## Target: ESP32-S3-BOX-3 AudioSense Recorder

dependencies:
  # ESP-BOX-3 BSP (includes display, audio codecs, SD card, I2C, I2S)
  espressif/esp-box-3: "^3.0.0"

  # ESP Codec Dev (required for IDF 5.3+ to avoid driver_ng conflict)
  esp_codec_dev:
    version: "^1.1.0"
    public: true

  # Opus encoder for Live Audio Mode. This is the esp-adf-libs audio
  # codec library packaged as a managed component; the encoder itself
  # ships as a prebuilt libesp_audio_codec.a per target, so the direct
  # esp_opus_enc_* API used by live_audio.c needs no Kconfig option
  # enabled. Full ESP-ADF is deliberately not used: it is a separate SDK
  # rather than a component, and its own audio_pipeline.h /
  # audio_pipeline_init() would collide by name with this project's
  # pipeline.
  espressif/esp_audio_codec:
    version: ">=2.5.0"

  # ---------- Built-in IDF components (no entry needed) ----------
  # esp_mqtt       → mqtt_client.h        (MQTT chunked upload)
  # mbedtls        → mbedtls/base64.h     (HTTP base64 encoding)
  # esp_http_client                        (HTTP Dash upload)
  # esp_https_server / esp_http_server     (local /ping endpoint)
  # nvs_flash, esp_wifi, esp_netif, esp_event, esp_sntp
  # All above are core ESP-IDF and linked automatically.

  # Required IDF version
  idf:
    version: ">=5.3.0"
