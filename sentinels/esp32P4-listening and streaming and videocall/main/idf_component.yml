## IDF Component Manager Manifest — merged sentinel + intercom
##
## The union of P4-audio-sentinel's and p4_webrtc_firmware's manifests.
## Where the two disagreed, the looser constraint wins so the solver can
## satisfy both: the sentinel pinned esp_hosted exactly, the intercom left
## it open, and the intercom's esp_capture needs a newer esp_video than the
## sentinel ever asked for.
##
## Not listed, because they are vendored into ../components rather than
## published on the registry: av_render, esp_peer, esp_webrtc,
## media_lib_utils, webrtc_utils and the Waveshare BSP.

dependencies:
  idf:
    version: ">=5.5"

  # ---------- WiFi via the on-board ESP32-C6 ----------
  # The P4 has no radio. esp_wifi_remote keeps the esp_wifi_* API surface
  # so both applications' WiFi code compiles unchanged; esp_hosted is the
  # SDIO transport to the C6. Left unpinned: the sentinel's exact 2.12.12
  # pin would only create a chance of contradicting what the WebRTC stack
  # resolves to.
  espressif/esp_wifi_remote:
    version: ">=1.3.1"
  # 3.x ships example paths that exceed Windows MAX_PATH while unpacking
  # the component cache. 2.12.12 is what the C6 slave firmware and the
  # working P4 videocall image already use.
  espressif/esp_hosted: "~2.12.12"

  # ---------- Audio ----------
  # Driven directly through esp_codec_dev in sentinel mode, and through
  # esp_capture / av_render in call mode. Both reference the same two
  # codec handles; the mode arbiter guarantees only one has them open.
  esp_codec_dev:
    version: ">=1.1.0"
    public: true

  # Opus encoder for the sentinel's live-audio (PTT) mode.
  espressif/esp_audio_codec:
    version: ">=2.5.0"

  # ---------- WebRTC stack ----------
  espressif/esp_capture: "*"
  espressif/esp_peer: "*"
  espressif/esp_websocket_client: "^1.2.0"

  # ---------- Camera ----------
  # esp_capture ~1.0 requires esp_video ^2.1; the CSI init shape used in
  # media_sys.c is the 2.x form (sccb_config.i2c_handle).
  espressif/esp_video:
    version: "^2.1"
    public: true

  # ---------- Graphics ----------
  # The sentinel's audio-bar UI. av_render draws into the same framebuffer
  # during a call; see mode_arbiter.h for how the two are kept apart.
  lvgl/lvgl:
    version: "9.4.*"
    public: true
